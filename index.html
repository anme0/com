<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye on Eyes</title>
    <!-- Link to the separate manifest.json file -->
    <link rel="manifest" href="/com/manifest.json">
    <!-- Updated path for the apple-touch-icon -->
    <link rel="apple-touch-icon" href="/com/IMG-20250821-WA0012.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- The main application UI -->
    <div class="bg-white shadow-xl rounded-2xl w-full max-w-sm p-6 flex flex-col items-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-4 text-center">Eye on Eyes</h1>
        <p class="text-gray-600 text-center mb-6">This is a simple Progressive Web App. Try using it offline!</p>

        <!-- A simple status indicator for demonstration -->
        <div id="status-container" class="bg-gray-100 rounded-lg p-4 w-full mb-6 text-center">
            <p id="status-message" class="text-sm font-semibold text-gray-700">Checking network status...</p>
        </div>

        <button id="add-to-home" class="hidden bg-blue-600 text-white font-semibold py-3 px-6 rounded-full shadow-lg hover:bg-blue-700 transition-colors duration-300">
            Install App
        </button>
    </div>

    <!-- The service worker registration and app logic -->
    <script>
        // Check for Service Worker support and register it
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Register the separate sw.js file
                navigator.serviceWorker.register('/com/sw.js')
                    .then(registration => {
                        console.log('Service Worker registered! Scope:', registration.scope);
                    })
                    .catch(err => {
                        console.log('Service Worker registration failed:', err);
                    });
            });
        }

        // Handle network status
        const statusMessage = document.getElementById('status-message');
        const updateStatus = () => {
            if (navigator.onLine) {
                statusMessage.textContent = 'You are online.';
                statusMessage.classList.remove('text-red-600');
                statusMessage.classList.add('text-green-600');
            } else {
                statusMessage.textContent = 'You are offline!';
                statusMessage.classList.remove('text-green-600');
                statusMessage.classList.add('text-red-600');
            }
        };

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();

        // Handle the beforeinstallprompt event to show a custom install button
        let deferredPrompt;
        const installButton = document.getElementById('add-to-home');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent the mini-infobar from appearing on mobile
            e.preventDefault();
            // Stash the event so it can be triggered later
            deferredPrompt = e;
            // Show the install button
            installButton.classList.remove('hidden');
        });

        installButton.addEventListener('click', async () => {
            // Hide the button
            installButton.classList.add('hidden');
            // Show the install prompt
            if (deferredPrompt) {
                deferredPrompt.prompt();
                // Wait for the user to respond to the prompt
                const { outcome } = await deferredPrompt.userChoice;
                // We've used the prompt, so clear the deferredPrompt variable
                deferredPrompt = null;
                console.log(`User response to the install prompt: ${outcome}`);
            }
        });

        // Listen for the appinstalled event
        window.addEventListener('appinstalled', (e) => {
            console.log('PWA was installed');
        });
    </script>
</body>
</html>
